name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Sprawdzenie, że dokumenty (docs/papers) się budują, zanim trafią na stronę.
  # Ścieżka ogranicza koszt: LaTeX uruchamia się tylko przy zmianie dokumentów.
  pull_request:
    paths:
      - 'docs/papers/**'
      - '.github/workflows/deploy-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # PDF-y dokumentów (regulamin, pilotaż) budowane z .tex w docs/papers.
  # Nic nie jest commitowane: PDF powstaje w każdym przebiegu.
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: xu-cheng/latex-action@v4
        with:
          root_file: regulamin-inference-polska.tex
          working_directory: docs/papers
      - uses: xu-cheng/latex-action@v4
        with:
          root_file: pilotaz-cennik-umowa.tex
          working_directory: docs/papers
      - uses: actions/upload-artifact@v4
        with:
          name: dokumenty-pdf
          path: docs/papers/*.pdf
          if-no-files-found: error

  deploy:
    if: github.event_name != 'pull_request'
    needs: pdf
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site
        env:
          SITE_TEMPLATE: ${{ vars.SITE_TEMPLATE }}
          SHOW_ANALIZA: ${{ vars.SHOW_ANALIZA }}
          SHOW_ANALIZA_OPIS: ${{ vars.SHOW_ANALIZA_OPIS }}
          SHOW_PYTANIE: ${{ vars.SHOW_PYTANIE }}
          SHOW_PYTANIE_OPIS: ${{ vars.SHOW_PYTANIE_OPIS }}
          SHOW_GABINET: ${{ vars.SHOW_GABINET }}
          SHOW_GABINET_OPIS: ${{ vars.SHOW_GABINET_OPIS }}
          SHOW_PROTOTYP: ${{ vars.SHOW_PROTOTYP }}
          SHOW_PROTOTYP_OPIS: ${{ vars.SHOW_PROTOTYP_OPIS }}
          SHOW_KSIAZKA: ${{ vars.SHOW_KSIAZKA }}
          SHOW_KSIAZKA_OPIS: ${{ vars.SHOW_KSIAZKA_OPIS }}
          SHOW_KONTRAKT: ${{ vars.SHOW_KONTRAKT }}
          SHOW_KONTRAKT_OPIS: ${{ vars.SHOW_KONTRAKT_OPIS }}
        run: python3 scripts/build-site.py _site
      - uses: actions/download-artifact@v4
        with:
          name: dokumenty-pdf
          path: _site/dokumenty
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
