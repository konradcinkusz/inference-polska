<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inference Polska: filmy</title>
<style>
:root{
  --paper:#f7f6f3; --ink:#14171a; --text:#3d4347; --muted:#5a6065; --rule:#d9d6ce; --tint:#eceee8; --card:#ffffff;
  --accent:#1c5a48; --accent-soft:#e3f1eb; --dark:#12261f; --mint:#8fd1b8; --warn:#a12a2a; --warn-soft:#fbeaea; --ok:#26683a;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--paper);font-family:var(--sans);color:var(--ink)}
body{cursor:pointer;user-select:none;-webkit-user-select:none}
body.nocursor{cursor:none}
#stage{position:fixed;inset:0;overflow:hidden;background-color:var(--paper);
  background-image:radial-gradient(circle at 1px 1px, #cfccc3 1.6px, transparent 0);background-size:44px 44px}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#route{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
#route path{fill:none;stroke:var(--accent);stroke-width:6;stroke-dasharray:4 26;stroke-linecap:round;opacity:.45}
.frame{position:absolute;width:1920px;height:1080px;padding:100px 120px;display:flex;flex-direction:column;gap:36px;background:var(--paper);border-radius:44px}
.frame.panel{box-shadow:0 40px 120px rgba(18,38,31,.28)}
.frame.dark{background:var(--dark);color:var(--paper);--ink:#f7f6f3;--card:#1f4034;--muted:#cfe3da}
.frame.green{background:var(--accent);color:#fff;justify-content:space-between}
.frame.side{flex-direction:row;align-items:center;gap:80px}
.eyebrow{font-size:26px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--accent)}
.dark .eyebrow{color:var(--mint)} .green .eyebrow{color:#cfe9df}
h1{font-size:104px;line-height:1.06;font-weight:700;letter-spacing:-2px}
h2{font-size:76px;line-height:1.1;font-weight:700;letter-spacing:-1px}
p{font-size:40px;line-height:1.35;color:var(--text)}
.dark p{color:#cfe3da} .green p{color:var(--accent-soft)}
.col{display:flex;flex-direction:column;gap:32px}
.photo{width:540px;height:700px;object-fit:cover;border-radius:32px;flex:none;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.url{font-size:40px;font-weight:700;color:#fff;background:rgba(255,255,255,.14);padding:18px 34px;border-radius:999px;align-self:flex-start}
.giant{font-size:230px;font-weight:700;line-height:1;letter-spacing:-6px;color:#fff}
svg.dg{flex:1;min-height:0;width:100%;overflow:visible}
svg.sq{width:640px;height:640px;flex:none;overflow:visible}
/* rysunek */
.ln{fill:none;stroke:var(--ink);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.ac{stroke:var(--accent)} .dark .ac{stroke:var(--mint)}
.fw{fill:var(--card);stroke:var(--ink);stroke-width:6;stroke-linejoin:round}
.fa{fill:var(--accent)} .dark .fa{fill:#2f8068}
.fi{fill:var(--ink)}
.ok{fill:var(--ok)} .bad{fill:var(--warn)}
.lw{fill:none;stroke:#fff;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
.lbad{fill:none;stroke:var(--warn);stroke-width:9;stroke-linecap:round}
.dash{fill:none;stroke:var(--muted);stroke-width:5;stroke-dasharray:14 14;stroke-linecap:round}
.zone{fill:rgba(28,90,72,.07);stroke:var(--accent);stroke-width:5;stroke-dasharray:18 14}
.dark .zone{fill:rgba(143,209,184,.08);stroke:var(--mint)}
.badzone{fill:rgba(161,42,42,.06);stroke:var(--warn);stroke-width:5;stroke-dasharray:18 14}
text{font-family:var(--sans)}
.lb{font-size:36px;font-weight:700;fill:var(--ink);text-anchor:middle}
.sm{font-size:28px;fill:var(--muted);text-anchor:middle}
.zl{font-size:26px;font-weight:700;letter-spacing:2px;fill:var(--accent);text-transform:uppercase}
.dark .zl{fill:var(--mint)}
.chipt{font-size:44px;font-weight:700;fill:#fff;text-anchor:middle}
.q{font-size:34px;font-weight:700;fill:var(--warn);text-anchor:middle}
.pl rect{fill:var(--card);stroke:var(--rule);stroke-width:3} .pl text{font-size:30px;font-weight:700;fill:var(--ink);text-anchor:middle}
.pl.g rect{fill:var(--accent);stroke:var(--accent)} .pl.g text{fill:#fff}
.pl.w rect{fill:var(--warn-soft);stroke:#d59a9a} .pl.w text{fill:var(--warn)}
.bigt{font-size:150px;font-weight:700;fill:var(--accent);text-anchor:middle;letter-spacing:-4px}
.nodenum{font-size:30px;font-weight:700;fill:#fff;text-anchor:middle}
.row text{font-size:26px;font-weight:700;fill:var(--ink)}
/* odsłanianie HTML */
.frame .base,.frame .it{opacity:0;transform:translateY(46px) scale(.985);transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.2,.7,.2,1)}
.frame.seen .base{opacity:1;transform:none}
.frame.seen .base:nth-child(2){transition-delay:.12s}
.frame .it.on{opacity:1;transform:none}
/* odsłanianie SVG */
.v{opacity:0;transform-box:fill-box;transform-origin:center;transition:opacity .6s,transform .8s cubic-bezier(.2,1.3,.3,1)}
.v.on{opacity:1}
.v.pop{transform:scale(.3)} .v.pop.on{transform:none}
.v.up{transform:translateY(50px)} .v.up.on{transform:none}
.v.grow{transform-origin:50% 100%;transform:scaleY(0);opacity:1;transition:transform 1s cubic-bezier(.2,.8,.2,1)} .v.grow.on{transform:none}
.draw{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.2s cubic-bezier(.5,0,.2,1)}
.on .draw,.draw.on{stroke-dashoffset:0}
.mvr{transition:transform 1.5s cubic-bezier(.6,0,.2,1),opacity .5s 1.1s}
.mvr.mv{transform:translate(var(--tx),var(--ty))}
.mvr.off{opacity:0}
.spin{transform-box:fill-box;transform-origin:center}
.on .spin{animation:spin 3.2s linear infinite}
.on .spin.rev{animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.on .pulse{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{transform:scale(1.12)}}
/* interfejs */
#menu{position:fixed;inset:0;background:var(--dark);color:var(--paper);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5vh;z-index:20;cursor:default;padding:4vh 4vw}
#menu.hide{display:none}
#menu h1{font-size:min(6vw,72px);text-align:center;letter-spacing:-1px}
#menu .films{display:flex;gap:2vw;flex-wrap:wrap;justify-content:center}
#menu button{font:inherit;cursor:pointer;text-align:left;background:rgba(255,255,255,.07);color:inherit;border:1px solid rgba(255,255,255,.2);border-radius:20px;padding:28px 32px;width:min(86vw,360px);display:flex;flex-direction:column;gap:10px}
#menu button:hover,#menu button:focus-visible{background:var(--accent);outline:none}
#menu button b{font-size:28px} #menu button span{font-size:17px;color:var(--mint);font-weight:700;letter-spacing:2px;text-transform:uppercase} #menu button i{font-style:normal;font-size:18px;color:#cfe3da}
#menu .keys{font-size:17px;line-height:1.7;color:#cfe3da;text-align:center;max-width:900px}
#menu .back{font-size:18px;font-weight:600;color:var(--mint);text-decoration:none;border-bottom:1px solid currentColor}
#menu .back:hover,#menu .back:focus-visible{color:#fff;outline:none}
kbd{font:inherit;font-weight:700;background:rgba(255,255,255,.14);border-radius:6px;padding:1px 8px}
#bar{position:fixed;left:0;bottom:0;height:4px;background:var(--accent);width:0;transition:width .6s;z-index:10}
#notes{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);width:min(1100px,92vw);background:rgba(20,23,26,.92);color:#fff;font-size:20px;line-height:1.5;padding:18px 24px;border-radius:14px;z-index:15;display:none}
body.notes #notes{display:block}
body.clean #bar{display:none}
@media (prefers-reduced-motion:reduce){.v,.mvr,.draw,.frame .base,.frame .it{transition:none}.on .spin,.on .pulse{animation:none}}
</style>
</head>
<body>
<div id="stage"><div id="world"><svg id="route"><path/></svg></div></div>
<div id="bar"></div>
<div id="notes"></div>
<div id="menu">
  <h1>Inference Polska: wybierz film</h1>
  <div class="films" id="films"></div>
  <p class="keys">
    <kbd>klik</kbd> / <kbd>rolka w dół</kbd> / <kbd>spacja</kbd> / <kbd>→</kbd> następny element ·
    <kbd>←</kbd> / <kbd>rolka w górę</kbd> / prawy przycisk myszy: cofnij (na pierwszym kadrze: powrót do menu) ·
    <kbd>N</kbd> tekst lektora · <kbd>H</kbd> ukryj pasek postępu · <kbd>C</kbd> ukryj kursor · <kbd>F</kbd> pełny ekran · <kbd>Esc</kbd> menu
  </p>
  <a class="back" href="../">← Wróć na stronę Inference Polska</a>
</div>

<script>
const PHOTO = "../assets/konrad-cinkusz.jpg";
const URL_TXT = "konradcinkusz.github.io/inference-polska";
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");

/* ---------- klocki rysunku ---------- */
const P = (x,y,s,inner) => `<g transform="translate(${x} ${y}) scale(${s})">${inner}</g>`;
const V = (s,inner,cls="pop",delay=0) => `<g class="v ${cls}" data-s="${s}"${delay?` style="transition-delay:${delay}s"`:""}>${inner}</g>`;
const MV = (m,tx,ty,inner,hide=true) => `<g class="mvr" data-m="${m}"${hide?` data-h="${m}"`:""} style="--tx:${tx}px;--ty:${ty}px">${inner}</g>`;
const T = (x,y,t,cls="lb") => `<text x="${x}" y="${y}" class="${cls}">${esc(t)}</text>`;
const L = (d,cls="ln") => `<path class="${cls} draw" pathLength="1" d="${d}"/>`;
const pill = (x,y,t,c="") => { const w = t.length*17.5+56; return `<g class="pl ${c}"><rect x="${x-w/2}" y="${y-32}" width="${w}" height="64" rx="32"/><text x="${x}" y="${y+11}">${esc(t)}</text></g>`; };
const gearTeeth = Array.from({length:8},(_,k)=>{const a=k*Math.PI/4,c=Math.cos(a),s=Math.sin(a);return `M${(20*c).toFixed(1)} ${(20*s).toFixed(1)}L${(32*c).toFixed(1)} ${(32*s).toFixed(1)}`}).join("");
const I = {
  doc:`<rect x="-46" y="-60" width="92" height="120" rx="10" class="fw"/><path class="ln" d="M-24 -28H24M-24 -4H24M-24 20H6"/>`,
  report:`<rect x="-46" y="-60" width="92" height="120" rx="10" class="fw"/><path class="fa" d="M-43 -57h86v24h-86z"/><path class="ln" d="M-24 -12H24M-24 10H24M-24 32H6"/>`,
  cloud:`<path class="fw" d="M-62 34a36 36 0 0 1 2-72a52 52 0 0 1 100 6a34 34 0 0 1 22 66z"/>`,
  chip:`<path class="ln ac" d="M-30 -60V-84M0 -60V-84M30 -60V-84M-30 60V84M0 60V84M30 60V84M-60 -30H-84M-60 0H-84M-60 30H-84M60 -30H84M60 0H84M60 30H84"/><rect x="-60" y="-60" width="120" height="120" rx="16" class="fa"/><text y="16" class="chipt">AI</text>`,
  person:`<circle cy="-34" r="24" class="fw"/><path class="fw" d="M-44 52a44 44 0 0 1 88 0z"/>`,
  check:`<circle r="34" class="ok"/><path class="lw" d="M-15 1l11 11l20-24"/>`,
  cross:`<circle r="34" class="bad"/><path class="lw" d="M-13 -13l26 26M13 -13l-26 26"/>`,
  lock:`<path class="ln ac" d="M-20 -8v-18a20 20 0 0 1 40 0v18"/><rect x="-34" y="-8" width="68" height="54" rx="10" class="fa"/>`,
  wifi:`<path class="ln" d="M-44 -6a62 62 0 0 1 88 0M-28 12a40 40 0 0 1 56 0M-12 30a18 18 0 0 1 24 0"/><circle cy="46" r="6" class="fi"/>`,
  slash:`<path class="lbad" d="M-52 56L52 -30"/>`,
  folder:`<path class="fw" d="M-56 -36h40l14 16h58v64h-112z"/>`,
  bubble:`<path class="fw" d="M-50 -42h100a12 12 0 0 1 12 12v44a12 12 0 0 1-12 12h-56l-24 24v-24h-20a12 12 0 0 1-12-12v-44a12 12 0 0 1 12-12z"/><path class="ln" d="M-28 -16H28M-28 4H10"/>`,
  gear:`<g class="spin"><path class="ln" d="${gearTeeth}"/><circle r="20" class="fw"/></g>`,
  warn:`<path class="bad" d="M0 -44L48 38H-48z"/><path class="lw" d="M0 -14v24M0 24v1"/>`,
  scan:`<rect x="-34" y="-54" width="68" height="46" class="fw"/><rect x="-58" y="-10" width="116" height="46" rx="8" class="fw"/><path class="ln ac" d="M-36 12H36"/>`,
  offer:`<rect x="-46" y="-60" width="92" height="120" rx="10" class="fw"/><path class="ln" d="M-24 -28H24M-24 -4H24"/><path class="ln ac" d="M-22 26l10 10l22-22"/>`
};
const node = (x,y,icon,n) => `<circle cx="${x}" cy="${y}" r="96" class="fw"/>${P(x,y,.95,icon)}<circle cx="${x-70}" cy="${y-70}" r="26" class="fa"/><text x="${x-70}" y="${y-60}" class="nodenum">${n}</text>`;
const head = f => `<p class="eyebrow base">${esc(f.e)}</p><h2 class="base">${esc(f.h)}</h2>`;
const dg = inner => `<svg class="dg" viewBox="0 0 1680 640">${inner}</svg>`;

/* cztery kroki na linii */
function line4(f){
  const xs=[230,637,1043,1450], y=230; let s="";
  f.nodes.forEach((n,i)=>{
    if(i) s += V(i+1, L(`M${xs[i-1]+100} ${y}H${xs[i]-100}`,"ln ac"), "");
    s += V(i+1, node(xs[i],y,n.icon,i+1)) + V(i+1, T(xs[i],y+170,n.t)+T(xs[i],y+214,n.d,"sm"), "up", .25);
  });
  return {cls:"", html: head(f)+dg(s)};
}

/* ---------- sceny ---------- */
const S = {
 a1: f => ({cls:"panel dark side", html:`
   <div class="col" style="flex:1"><p class="eyebrow base">${esc(f.e)}</p><h1 class="base">${f.h}</h1><p class="it" data-s="3">${esc(f.p)}</p></div>
   <svg class="sq" viewBox="0 0 640 640">
     <rect x="40" y="90" width="560" height="460" rx="40" class="zone"/>
     ${P(430,320,1.7,I.chip)}
     ${V(1, MV(2,270,0,P(160,320,1.5,I.doc)))}
     ${V(2, P(322,150,1,I.gear)+P(380,112,.7,`<g class="spin rev">${I.gear.replace('class="spin"','')}</g>`), "", 1.2)}
     ${V(3, P(520,205,1.1,I.lock))}
     ${V(3, pill(320,600,"bez internetu","g"), "up", .2)}
   </svg>`}),
 a2: f => ({cls:"", html: head(f)+dg(`
   <rect x="20" y="60" width="700" height="540" rx="36" class="zone"/>${T(60,112,"Polska","zl")}
   ${P(170,330,1.6,I.person)}${T(170,470,"Ty")}
   ${V(2, `<rect x="960" y="60" width="700" height="540" rx="36" class="badzone"/>${T(1000,112,"za granicą","zl")}${P(1360,280,2.4,I.cloud)}${T(1360,440,"Serwer dostawcy AI")}`, "up")}
   ${V(3, L("M470 300C700 120 1000 120 1240 250","dash"), "")}
   ${V(1, MV(3,960,-50,P(400,330,1.5,I.doc),false))}
   ${V(4, T(1090,545,"Gdzie?","q"), "pop", 1.2)}
   ${V(4, T(1320,545,"Jak długo?","q"), "pop", 1.5)}
   ${V(4, T(1545,545,"Kto widzi?","q"), "pop", 1.8)}
 `)}),
 a3: f => ({cls:"", html: head(f)+dg(`
   <rect x="20" y="40" width="1180" height="580" rx="36" class="zone"/>${T(60,92,"Moje biuro","zl")}
   ${P(600,320,1.7,I.chip)}${T(600,510,"Lokalna AI")}
   ${V(1, P(1480,170,1.9,I.cloud)+T(1480,290,"Internet","sm"), "up")}
   ${V(1, L("M705 240C850 110 1100 100 1340 165","dash"), "")}
   ${V(2, P(1215,128,1.3,I.cross))}
   ${V(2, pill(1440,400,"brak połączenia","w"), "up", .3)}
   ${V(3, MV(4,390,0,P(200,320,1.5,I.doc)))}${V(3, T(200,470,"Twoje dokumenty","sm"), "up")}
   ${V(4, P(520,135,1,I.gear)+P(590,100,.75,`<g class="spin rev">${I.gear.replace('class="spin"','')}</g>`), "", 1.1)}
   ${V(5, L("M745 320H820","ln ac")+P(900,320,1.4,I.person)+P(945,265,.8,I.check), "up")}${V(5, T(900,470,"Sprawdzam sam","sm"), "up", .2)}
   ${V(6, L("M975 320H1010","ln ac")+P(1090,320,1.5,I.report), "up")}${V(6, T(1090,470,"Raport","sm"), "up", .2)}
   ${V(7, pill(600,572,"po wszystkim: dane usunięte","g"), "up")}
 `)}),
 a5: f => ({cls:"", html: head(f)+dg(`
   ${V(1, `<rect x="60" y="10" width="520" height="620" rx="20" class="fw"/><path class="fa" d="M63 13h514v74h-514z"/><text x="320" y="64" class="nodenum" style="font-size:34px">RAPORT</text>`, "up")}
   ${f.rows.map((r,i)=>V(2, `<g class="row"><circle cx="112" cy="${150+i*80}" r="22" class="fa"/><text x="112" y="${159+i*80}" class="nodenum" style="font-size:24px">${i+1}</text><text x="154" y="${159+i*80}">${esc(r)}</text><path class="ln" style="stroke-width:3;opacity:.25" d="M154 ${180+i*80}H540"/></g>`, "up", i*.18)).join("")}
   ${V(3, L("M600 280H840","ln ac"), "")}
   ${V(3, P(960,120,1.1,I.person)+T(1090,135,"Prawnik").replace('class="lb"','class="lb" style="text-anchor:start"'), "up", .4)}
   ${V(3, P(960,280,1.1,I.person)+T(1090,295,"Lekarz").replace('class="lb"','class="lb" style="text-anchor:start"'), "up", .6)}
   ${V(3, P(960,440,1.1,I.person)+T(1090,455,"Doradca podatkowy").replace('class="lb"','class="lb" style="text-anchor:start"'), "up", .8)}
   ${V(4, pill(1240,585,"to nie jest porada: to przygotowanie do rozmowy","w"), "up")}
 `)}),
 price: f => ({cls:"panel green", html:`
   <p class="eyebrow base">${esc(f.e)}</p>
   <div style="display:flex;align-items:center;gap:70px">
     <p class="giant base">${esc(f.big)}</p>
     <svg viewBox="0 0 520 360" style="width:520px;height:360px;overflow:visible;--ink:#fff;--card:#1c5a48">
       ${[0,1,2,3,4].map(i=>V(1,`<rect x="${150-i*18}" y="${40+i*22}" width="210" height="270" rx="14" style="fill:#fff;stroke:#12261f;stroke-width:5"/>`,"up",i*.12)).join("")}
       ${V(1,`<text x="183" y="270" style="font-size:110px;font-weight:700;fill:#1c5a48;text-anchor:middle">50</text><text x="183" y="320" style="font-size:34px;font-weight:700;fill:#1c5a48;text-anchor:middle">stron</text>`,"pop",.7)}
     </svg>
   </div>
   <div class="col" style="gap:22px"><p class="it" data-s="2" style="font-size:52px;font-weight:700;color:#fff">${esc(f.a)}</p><p class="url it" data-s="3">${URL_TXT}</p></div>`}),
 cta: f => ({cls:"panel green", html:`
   <p class="eyebrow base">${esc(f.e)}</p>
   <div style="display:flex;align-items:center;gap:80px">
     <h1 class="base" style="flex:1">${f.h}</h1>
     <svg viewBox="0 0 420 420" style="width:420px;height:420px;overflow:visible;--ink:#fff;--card:#1c5a48;--accent:#fff">
       ${V(1, P(140,210,2,I.bubble))}${V(1, P(300,250,1.7,I.person), "pop", .3)}
     </svg>
   </div>
   <div class="col" style="gap:22px"><p class="it" data-s="2" style="font-size:52px;font-weight:700;color:#fff">${esc(f.a)}</p><p class="url it" data-s="3">${URL_TXT}</p></div>`}),
 b1: f => ({cls:"panel dark side", html:`
   <div class="col" style="flex:1"><p class="eyebrow base">${esc(f.e)}</p><h1 class="base">${f.h}</h1><p class="it" data-s="3">${esc(f.p)}</p></div>
   <svg class="sq" viewBox="0 0 640 640">
     <path class="zone" d="M60 260L320 70L580 260V560H60z"/>
     ${V(1, P(320,400,1.6,I.chip))}
     ${V(2, P(150,470,1.1,I.person)+P(490,470,1.1,I.person), "up")}
     ${V(2, L("M200 440L235 420","ln ac")+L("M440 440L405 420","ln ac"), "", .3)}
     ${V(3, P(320,215,1.2,I.lock))}
     ${V(3, pill(320,610,"zawsze offline","g"), "up", .2)}
   </svg>`}),
 b2: f => ({cls:"", html: head(f)+dg(`
   <rect x="20" y="40" width="820" height="580" rx="36" class="zone"/>${T(60,92,"Twoje biuro","zl")}
   ${V(1, P(250,230,1.5,I.folder)+T(250,330,"Księgi klientów","sm"), "up")}
   ${V(1, P(250,450,1.5,I.folder)+T(250,550,"Dokumentacja pacjentów","sm"), "up", .2)}
   ${V(2, P(620,330,1.6,I.person)+T(620,470,"Pracownik"), "up")}

const POS = [[0,0,0],[2700,620,-5],[5500,-380,4],[8100,900,-3],[10900,60,5],[13700,520,0]];
const world = document.getElementById("world"), route = document.querySelector("#route path");
const menu = document.getElementById("menu"), bar = document.getElementById("bar"), notes = document.getElementById("notes");
let film = null, fi = 0, step = 0, els = [], maxStep = [], anim = null;

function build(f){
  world.querySelectorAll(".frame").forEach(e=>e.remove());
  els = []; maxStep = [];
  f.frames.forEach((fr,i)=>{
    const r = S[fr.t](fr), [x,y,rot] = POS[i];
    const d = document.createElement("section");
    d.className = "frame " + r.cls;
    d.style.cssText = `left:${x}px;top:${y}px;transform:rotate(${rot}deg)`;
    d.innerHTML = r.html;
    world.appendChild(d); els.push(d);
    maxStep.push(Math.max(0,...[...d.querySelectorAll("[data-s],[data-m]")].map(e=>+(e.dataset.s||e.dataset.m))));
  });
  route.setAttribute("d","M"+POS.map(([x,y])=>`${x+960} ${y+540}`).join(" L"));
}
function cam(i, k=1){
  const [x,y,r] = POS[i], vw = innerWidth, vh = innerHeight, s = Math.min(vw/1920, vh/1080)*k;
  return {x:x+960, y:y+540, r, s, vw, vh};
}
const tf = c => `translate(${c.vw/2}px,${c.vh/2}px) scale(${c.s}) rotate(${-c.r}deg) translate(${-c.x}px,${-c.y}px)`;
function fly(from, to){
  const a = cam(from), b = cam(to);
  const mid = {x:(a.x+b.x)/2, y:(a.y+b.y)/2, r:(a.r+b.r)/2, s:Math.min(a.s,b.s)*.62, vw:b.vw, vh:b.vh};
  if(anim) anim.cancel();
  world.style.transform = tf(b);
  if(from===to || matchMedia("(prefers-reduced-motion:reduce)").matches) return;
  anim = world.animate([{transform:tf(a)},{transform:tf(mid),offset:.5},{transform:tf(b)}],{duration:1700,easing:"cubic-bezier(.6,0,.25,1)"});
}
function paint(){
  els.forEach((d,i)=>{
    d.classList.toggle("seen", i<=fi);
    const at = (v) => i<fi || (i===fi && +v<=step);
    d.querySelectorAll("[data-s]").forEach(e=>e.classList.toggle("on", at(e.dataset.s)));
    d.querySelectorAll("[data-m]").forEach(e=>e.classList.toggle("mv", at(e.dataset.m)));
    d.querySelectorAll("[data-h]").forEach(e=>e.classList.toggle("off", at(e.dataset.h)));
  });
  const total = maxStep.reduce((a,b)=>a+b+1,0), done = maxStep.slice(0,fi).reduce((a,b)=>a+b+1,0)+step+1;
  bar.style.width = (100*done/total)+"%";
  notes.textContent = film.frames[fi].n;
}
function next(){
  if(!film) return;
  if(step < maxStep[fi]){ step++; paint(); }
  else if(fi < els.length-1){ const p=fi; fi++; step=0; fly(p,fi); setTimeout(paint, 900); }
}
function prev(){
  if(!film) return;
  if(step>0){ step--; paint(); }
  else if(fi>0){ const p=fi; fi--; step=maxStep[fi]; paint(); fly(p,fi); }
  else toMenu();
}
function start(i){
  film = FILMS[i]; fi = 0; step = 0; build(film);
  menu.classList.add("hide"); world.style.transform = tf(cam(0,.55));
  requestAnimationFrame(()=>{
    if(anim) anim.cancel();
    anim = world.animate([{transform:tf(cam(0,.55))},{transform:tf(cam(0))}],{duration:1400,easing:"cubic-bezier(.3,0,.2,1)"});
    world.style.transform = tf(cam(0)); setTimeout(paint,500);
  });
  try{ history.replaceState(null,"","#"+film.id); }catch(e){}
}
function toMenu(){ film=null; menu.classList.remove("hide"); bar.style.width=0; try{history.replaceState(null,"","#");}catch(e){} }

document.getElementById("films").innerHTML = FILMS.map((f,i)=>`<button data-i="${i}"><span>${f.tag} · klawisz ${i+1}</span><b>${f.name}</b><i>${f.desc}</i></button>`).join("");
menu.addEventListener("click", e=>{ const b=e.target.closest("button"); if(b){ e.stopPropagation(); start(+b.dataset.i); } });
document.getElementById("stage").addEventListener("click", next);
let wheelAt = 0;
addEventListener("wheel", e=>{
  if(!film) return;
  e.preventDefault();
  const now = Date.now();
  if(Math.abs(e.deltaY) < 4 || now - wheelAt < 450) return;
  wheelAt = now;
  if(e.deltaY > 0) next(); else prev();
}, {passive:false});
addEventListener("contextmenu", e=>{ if(film){ e.preventDefault(); prev(); } });
addEventListener("keydown", e=>{
  const k = e.key;
  if(!film){ if(k==="1"||k==="2"||k==="3") start(+k-1); return; }
  if(k===" "||k==="ArrowRight"||k==="Enter"||k==="PageDown"){ e.preventDefault(); next(); }
  else if(k==="ArrowLeft"||k==="Backspace"||k==="PageUp"){ e.preventDefault(); prev(); }
  else if(k==="Escape") toMenu();
  else if(k==="n"||k==="N") document.body.classList.toggle("notes");
  else if(k==="h"||k==="H") document.body.classList.toggle("clean");
  else if(k==="c"||k==="C") document.body.classList.toggle("nocursor");
  else if(k==="f"||k==="F"){ if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen(); }
});
addEventListener("resize", ()=>{ if(film){ if(anim) anim.cancel(); world.style.transform = tf(cam(fi)); } });
const h0 = location.hash.slice(1), hi = FILMS.findIndex(f=>f.id===h0);
if(hi>=0) start(hi);
